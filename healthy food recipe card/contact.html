<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
    <link rel="stylesheet" class="bth" href="../healthy food recipe card/contact_style.css">
</head>
<body>
    <a class="bth" href="../healthy food recipe card/index.html"><button class="bth">BACK TO HOME</button></a>
    <section> 
        <div id="d1">
        <label for="usn">USERNAME </label>
        <input type="text" placeholder="first" id="usn" name="username" required>
        <input type="text" placeholder="last" id="usn" name="username" ></div>
        <div id="d2">
        <label for="emails">EMAIL</label>
        <input type="email" placeholder="ENTER YOUR EMAIL" id="emails" name="email" required>
        </div> 
        <div id="d3">
        <label for="numbers">NUMBER</label>
        <input type="number" id="numbers" placeholder="ENTER YOUR NUMBER" name="number" required>
        </div>
        <div id="d4">
            <label for="message s">MESSAGE SUBJECT</label>
            <select name="MESSAGE SUBJECT" id="message s">
                <option value="REQUEST">REQUEST</option>
                <option value="PROPOSAL">PROPOSAL</option>
                <option value="SUGGESTION">SUGGESTION</option>
                <option value="OTHER">OTHER</option>
            </select>
        </div>
        <div id="d5">
        <label for="massage">MASSAGE</label>
        <input type="textarea" aria-colspan="50" aria-rowspan="25">
        </div>
        <div id="d6">
            <button>SEND MESSAGE</button>
        </div>
    </section>
</body>
</html>
